    <script>
      // Gracefully ignore Vite dev client HMR websocket errors in cloud proxy/iframe environments
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          ((typeof event.reason.message === 'string' &&
            event.reason.message.includes('WebSocket closed without opened')) ||
            (typeof event.reason.stack === 'string' &&
              event.reason.stack.includes('@vite/client')))
        ) {
          event.preventDefault();
        }
      });
    </script>
